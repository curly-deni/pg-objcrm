name: Deploy Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Type the production Supabase project ref to confirm the target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  verify:
    name: Recheck before database deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, types, tests, and build
        run: |
          npm run format:check
          npm run typecheck
          npm run test:coverage

      - name: Start local Supabase
        run: |
          if ! npm run supabase:start > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "::error::Supabase failed to start. Startup output is stored in the runner temp directory."
            exit 1
          fi

      - name: Reset the local database and seed test users
        run: npm run local:reset

      - name: Test database permissions through user sessions
        run: npm run test:api

      - name: Build for production
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop > /dev/null 2>&1 || true

  deploy:
    name: Apply reviewed migrations to Supabase
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-production
    env:
      SUPABASE_PROJECT_REF: xsnxbcuazkgddtegosrg

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm the production project
        env:
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: |
          test "$CONFIRM_PROJECT_REF" = "$SUPABASE_PROJECT_REF" || {
            echo "::error::The confirmation does not match the configured Supabase project."
            exit 1
          }

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm exec -- supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm exec -- supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
